<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="vinyl-gradient">
      <stop offset="0%" style="stop-color:#ff4d8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a385ff;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Main disc -->
  <circle cx="50" cy="50" r="45" fill="#0d0a1c" stroke="url(#vinyl-gradient)" stroke-width="2"/>
  
  <!-- Grooves pattern -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#1a1432" stroke-width="0.5"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#1a1432" stroke-width="0.5"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="#1a1432" stroke-width="0.5"/>
  <circle cx="50" cy="50" r="29" fill="none" stroke="#1a1432" stroke-width="0.5"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#1a1432" stroke-width="0.5"/>
  <circle cx="50" cy="50" r="23" fill="none" stroke="#1a1432" stroke-width="0.5"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#1a1432" stroke-width="0.5"/>
  
  <!-- Center label -->
  <circle cx="50" cy="50" r="18" fill="url(#vinyl-gradient)" opacity="0.9"/>
  <circle cx="50" cy="50" r="14" fill="#ff4d8a" opacity="0.7"/>
  
  <!-- Center hole -->
  <circle cx="50" cy="50" r="7" fill="#0d0a1c"/>
</svg>
